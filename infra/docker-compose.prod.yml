# ──────────────────────────────────────────────────────────────
# Production docker-compose
#
# Usage:
#   cp .env.prod.example .env.prod   # fill in real values
#   docker compose -f infra/docker-compose.prod.yml up -d
#
# First-time SSL certificate:
#   docker compose -f infra/docker-compose.prod.yml run --rm certbot \
#     certonly --webroot -w /var/www/certbot -d $DOMAIN --agree-tos -m admin@$DOMAIN
# ──────────────────────────────────────────────────────────────

services:
  # ── Database ─────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexttrack}
      POSTGRES_USER: ${POSTGRES_USER:-nexttrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexttrack}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Cache / Queue ────────────────────────────────────────
  valkey:
    image: valkey/valkey:9.1.0-alpine
    restart: unless-stopped
    command: valkey-server --requirepass ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Search ───────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:3.6.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      # Security is off, so skip the demo TLS/user bootstrap it would install.
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Object storage ───────────────────────────────────────
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-access-key"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}
      # The API authenticates with the same pair, so the key is the API's.
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── DB migrations (one-shot, runs before the API) ───────
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migrator
    env_file: ../.env.prod
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # ── API (NestJS) ─────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      garage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Web (Next.js) ────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001/api
    depends_on:
      - api

  # ── Reverse proxy ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/ssl-params.conf:/etc/nginx/conf.d/ssl-params.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    depends_on:
      - api
      - web

  # ── SSL certificate renewal ──────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

volumes:
  postgres_data:
  valkey_data:
  opensearch_data:
  garage_data:
  letsencrypt:
  certbot_webroot:
